version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: ai_smart_mart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_smart_mart}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai_smart_mart-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_smart_mart-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@ai_smart_mart-postgres:5432/${POSTGRES_DB:-ai_smart_mart}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-AI_smart_martBot}
      TELEGRAM_POLLING_ENABLED: "true"
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-3.6-flash}
      AI_API_KEY: ${AI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${AI_API_KEY:-}}
      STORE_NAME: ${STORE_NAME:-Sri Lakshmi Supermarket}
      STORE_GSTIN: ${STORE_GSTIN:-29AAAPL1234C1ZV}
    ports:
      - "8080:8080"

volumes:
  pgdata:
